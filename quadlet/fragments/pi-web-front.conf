# ---- pi-web front (NPM_PI_WEB_FRONT=true) ----
# NPM also joins the pi-agent network, so a proxy host can forward to
# pi-web:30141 by name, and loads the Host/Origin rewrite that pi-web's trust
# guard requires (~/.config/npm/pi-web-front/, from config/pi-web-front/).
# See Woow_podman_pi_agent_package docs/downstream-nginx.md.
[Unit]
# Ordering only. Wants= rather than Requires= so that reinstalling, upgrading
# or uninstalling the pi-agent package can never stop NPM or fail its start;
# NPM fronts other services too.
Wants=pi-agent-network.service
After=pi-agent-network.service

[Container]
# A plain network name on purpose: "pi-agent.network" would add a hard
# Requires= (a stop of pi-agent-network.service would stop NPM), and Quadlet
# 4.9 resolves it to "systemd-pi-agent" when that file is absent.
Network=pi-agent
# Both mounts are read-write on purpose. NPM 2.15.1's prepare stage
# (50-ipv6.sh) skips mounted files when it rewrites configs, but then runs an
# unconditional `chown -R` over /etc/nginx/conf.d under `set -e`. A :ro bind
# makes that chown fail with EROFS and the prepare stage fails.
Volume=%h/.config/npm/pi-web-front/proxy.conf:/etc/nginx/conf.d/include/proxy.conf
Volume=%h/.config/npm/pi-web-front/maps.conf:/etc/nginx/conf.d/00-woow-pi-web-front.conf

[Service]
# Self-healing: the same command pi-agent-network.service runs, so NPM still
# starts if the pi-agent units were never installed on this host, or were removed.
ExecStartPre=podman network create --ignore pi-agent
