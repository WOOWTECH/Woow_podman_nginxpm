# Replaces /etc/nginx/conf.d/include/proxy.conf of jc21/nginx-proxy-manager:2.15.1,
# which every generated proxy host includes inside its `location /`.
#
# It is the stock file except for the Host and Origin lines, which take their values
# from maps.conf. For every upstream other than pi-web those evaluate to the stock
# behaviour ($host, and the client's own Origin), so other proxy hosts are unaffected.
#
# Why a global include and not the proxy host's Advanced tab: NPM emits its own
# `proxy_set_header Host $host` inside `location /`, and nginx does not inherit
# server-level proxy_set_header into a location that sets any of its own. An Advanced
# override is therefore shadowed and every /api/* route answers 403.
#
# tests/pi-web-front.sh diffs this file against the pinned image's copy. An NPM
# version bump must pass that test before upgrade.sh will switch images.
add_header       X-Served-By $host;
proxy_set_header Host $woow_upstream_host;
proxy_set_header Origin $woow_upstream_origin;
proxy_set_header X-Forwarded-Scheme $x_forwarded_scheme;
proxy_set_header X-Forwarded-Proto  $x_forwarded_proto;
proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
proxy_set_header X-Real-IP          $remote_addr;
proxy_pass       $forward_scheme://$server:$port$request_uri;
