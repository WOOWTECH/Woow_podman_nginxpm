# http-level maps for the pi-web front. Mounted as
# /etc/nginx/conf.d/00-woow-pi-web-front.conf; NPM's nginx.conf includes conf.d/*.conf
# inside `http {}` before the proxy hosts.
#
# Keyed on $server, the upstream host NPM sets per proxy host (its "Forward
# Hostname / IP"), not on the public domain name. Every proxy host that forwards to
# pi-web gets the rewrite, whatever names it serves: a public hostname, a tailnet
# name, or a raw IP. Nothing here is deployment-specific.
#
# pi-web's isApiRequestAllowed() accepts only a loopback or raw-IP Host, and only a
# matching Origin; with a hostname in front, every /api/* route answers 403.
#
# The variable names are new ($woow_*), so this never collides with the $npm_upstream_*
# maps that older hand-made setups keep in /data/nginx/custom/http_top.conf.
map $server $woow_upstream_host {
    default  $host;
    pi-web   localhost;
}

map $server $woow_upstream_origin {
    default  $http_origin;
    pi-web   "";
}
